# Czech end-to-end RAG on SQAD 3.0 (a filtered copy of the LINDAT release, on Hugging Face).
#
# Licence, checked on LINDAT on 8 Nov 2026: SQAD 3.0 is LGPL-3.0
# (http://hdl.handle.net/11234/1-3069). The mirror's card says MIT; the upstream licence governs.
#
# Corpus is every distinct context paragraph across all three splits (~7.5k),
# so a test question is not searching a corpus made only of its own answers.
name: cz_rag
device: cpu
seed: 20260101
query_threads: 1
timeout_s: 604800

dataset:
  name: sqad
  max_docs: 100000
  max_queries: 200

retrieval:
  top_k: 100
  ks: [10, 100]
  context_k: 3
  quality_key: ndcg@10

budgets:
  ram_gb: [4, 8, 16]
  retrieval_ms: [200, 500]
  e2e_s: [3, 8]

retrievers:
  - id: bm25
    kind: bm25
  - id: e5-small
    kind: dense
    model: e5-small
  - id: retromae-cs
    kind: dense
    model: retromae-cs

# The Czech generations ran on a GX10's GPU, while retrieval stayed on its CPU. Gemma 4 and Qwen2.5 answered
# together; Gemma 3n, Ministral 3 and Qwen3.5 were each run alone on the same machine.
# On a machine without CUDA, set rag.device to cpu: the answers can then differ near a tie.
rag:
  enabled: true
  generators: [qwen2.5-1.5b, gemma-4-e2b, ministral-3-3b, qwen3.5-2b, gemma-3n-e2b]
  max_tokens: 256
  n_ctx: 4096
  device: cuda
