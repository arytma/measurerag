# Run 2 natural sweep: HotpotQA, the run-1 slice, context k = 5.
# Same harness, same prompt, same seeds as configs/en_rag.yaml; max_tokens 64.
name: crossover_hotpotqa_k5
out_dir: results/crossover/natural/hotpotqa_k5
device: cpu
seed: 20260101
query_threads: 1
timeout_s: 36000

dataset:
  name: hotpotqa-rag
  max_docs: 100000
  max_queries: 500

retrieval:
  top_k: 100
  ks: [10, 100]
  context_k: 5
  quality_key: ndcg@10

budgets:
  ram_gb: [4, 8, 16]
  retrieval_ms: [200, 500]
  e2e_s: [3, 8]

retrievers:
  # bm25, e5-small and tfidf-svd at k = 5 are run 1's runs in results/en_rag,
  # reused because this run's max_tokens check found identical strings.
  - id: e5-base
    kind: dense
    model: e5-base

rag:
  enabled: true
  generators: [qwen2.5-1.5b, qwen2.5-3b]
  max_tokens: 64
  n_ctx: 4096
