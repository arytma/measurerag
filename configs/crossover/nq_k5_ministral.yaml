# Ministral 3's English sweep (v0.4.2): configs/crossover/nq_k5.yaml with Ministral 3 3B and 8B in Qwen2.5 1.5B's and 3B's places;
# everything else as there. Its own out_dir, so run 2's results stay as they are.
# Run 2 natural sweep: Natural Questions (BEIR nq + nq-open), 300 questions, context k = 5.
# Same harness, same prompt, same seeds as configs/en_rag.yaml; max_tokens 64.
name: crossover_nq_k5_ministral
out_dir: results/crossover/natural/nq_k5_ministral
device: cpu
seed: 20260101
query_threads: 1
timeout_s: 36000

dataset:
  name: nq-rag
  max_docs: 100000
  max_queries: 300

retrieval:
  top_k: 100
  ks: [10, 100]
  context_k: 5
  quality_key: ndcg@10

budgets:
  ram_gb: [4, 8, 16]
  retrieval_ms: [200, 500]
  e2e_s: [3, 8]

retrievers:
  - id: tfidf-svd
    kind: tfidf-svd
    n_components: 256
  - id: bm25
    kind: bm25
  - id: e5-small
    kind: dense
    model: e5-small
  - id: e5-base
    kind: dense
    model: e5-base
  # step 5 of the specification
  - id: bge-m3
    kind: dense
    model: bge-m3

rag:
  enabled: true
  generators: [ministral-3-3b, ministral-3-8b]
  max_tokens: 64
  n_ctx: 4096
