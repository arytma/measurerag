# Reduced sample of en_rag: 100 questions, 3 passages of context. Same machinery,
# same metrics, a first look in minutes rather than hours.
name: en_rag_quick
device: cpu
seed: 20260101
query_threads: 1
timeout_s: 36000

dataset:
  name: hotpotqa-rag
  max_docs: 20000      # cut for wall-clock, not for science
  max_queries: 100

retrieval:
  top_k: 100
  ks: [10, 100]
  context_k: 3        # passages handed to the generator; also the gold-in-context k
  quality_key: ndcg@10

budgets:
  ram_gb: [4, 8, 16]
  retrieval_ms: [200, 500]
  e2e_s: [3, 8]

retrievers:
  - id: bm25
    kind: bm25
  - id: e5-small
    kind: dense
    model: e5-small

rag:
  enabled: true
  generators: [qwen2.5-1.5b, qwen2.5-3b]
  max_tokens: 256
  n_ctx: 4096
