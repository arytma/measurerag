[project]
name = "measurerag"
version = "0.4.5"
description = "Budget-aware retrieval and RAG benchmark in Czech and English, for a single machine with no network access"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Phil Laznicek", email = "research@arytma.ca" }]
keywords = ["rag", "retrieval", "benchmark", "czech", "air-gapped", "budget"]

dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pyyaml>=6.0,<7",
  "psutil>=5.9,<8",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "tqdm>=4.66,<5",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "bm25s>=0.2,<1",
  "PyStemmer>=2.2,<4",
  "simplemma>=1.1,<2",       # bm25-lemma; its lemma tables ship in the wheel
  "requests>=2.31,<3",
]

[project.urls]
Repository = "https://github.com/arytma/measurerag"

[project.optional-dependencies]
dense = [
  "torch>=2.2,<3",
  "sentence-transformers>=3.0,<6",
  "transformers>=4.40,<6",
  "faiss-cpu>=1.8,<2",
  "huggingface-hub>=0.23,<1",
  "datasets>=2.19,<5",
]
rag = [
  "llama-cpp-python>=0.3,<1",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-timeout>=2.3,<3",
]

[project.scripts]
measurerag = "measurerag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/measurerag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
